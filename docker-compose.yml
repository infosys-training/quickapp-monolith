version: '3.8'

services:
  monolith:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5225:5225"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/quickapp.db
      - UseDatabase=Sqlite
      - OrderService__BaseUrl=http://order-service:5003
    volumes:
      - monolith_data:/app/data
    depends_on:
      - order-service

  order-service:
    build:
      context: ../quickapp-microservices/src
      dockerfile: Services/Order/Order.API/Dockerfile
    ports:
      - "5003:5003"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/order.db
    volumes:
      - order_data:/app/data

volumes:
  monolith_data:
  order_data:
